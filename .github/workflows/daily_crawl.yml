name: Daily Card Crawl

on:
  schedule:
    - cron: "0 21 * * *"

  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run crawler
        run: |
          python crawler.py

      - name: Check result
        run: |
          echo "cards.json 확인"
          python -c "import json; d=json.load(open('cards.json', encoding='utf-8')); print('수집 카드:', d['total'])"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cards.json

          git diff --cached --quiet || git commit -m "Update card list"

          git push
